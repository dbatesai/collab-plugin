name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node syntax check
        run: |
          set -e; shopt -s globstar nullglob; fail=0
          for f in skills/collab/scripts/**/*.mjs; do
            echo "checking $f"; node --check "$f" || fail=1
          done; exit $fail
      - name: Validate plugin manifests
        run: |
          set -e
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/plugin.json .gemini-plugin/plugin.json; do
            echo "parsing $f"; node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done
      - name: plugin.json required fields
        run: |
          node -e '
            const m=JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json","utf8"));
            for(const k of ["name","version","description","author","license"])
              if(!m[k]){console.error("missing: "+k);process.exit(1);}
            console.log("fields ok");'
      - name: Harness manifest lockstep
        run: |
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync(".claude-plugin/plugin.json","utf8")).version;
            const x=JSON.parse(fs.readFileSync(".codex-plugin/plugin.json","utf8")).version;
            const g=JSON.parse(fs.readFileSync(".gemini-plugin/plugin.json","utf8")).version;
            if(c!==x||c!==g){console.error("DRIFT",{c,x,g});process.exit(1);}
            console.log("lockstep OK:",c);'
      - name: SKILL.md frontmatter
        run: |
          node -e '
            const src=require("fs").readFileSync("skills/collab/SKILL.md","utf8");
            const m=src.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if(!m){console.error("no frontmatter");process.exit(1);}
            for(const k of ["name","description"])
              if(!new RegExp("^"+k+":\\s*\\S","m").test(m[1])){console.error("missing: "+k);process.exit(1);}
            console.log("SKILL.md frontmatter OK");'
      - name: Codex marketplace path integrity
        run: |
          node -e '
            const fs=require("fs"),path=require("path");
            const market=JSON.parse(fs.readFileSync(".agents/plugins/marketplace.json","utf8"));
            const rootVersion=JSON.parse(fs.readFileSync(".codex-plugin/plugin.json","utf8")).version;
            let failed=0;
            for(const p of market.plugins||[]){
              if(!p.source||p.source.source!=="local")continue;
              const pluginDir=path.resolve(p.source.path);
              if(!fs.existsSync(pluginDir)){console.error("dir missing: "+p.source.path);failed=1;continue;}
              const pjPath=path.join(pluginDir,".codex-plugin","plugin.json");
              if(!fs.existsSync(pjPath)){console.error("missing: "+pjPath);failed=1;continue;}
              const pj=JSON.parse(fs.readFileSync(pjPath,"utf8"));
              if(pj.name!==p.name){console.error("name mismatch: marketplace="+p.name+" vs pj="+pj.name);failed=1;}
              if(pj.version!==rootVersion){console.error("version drift: root="+rootVersion+" plugin="+pj.version);failed=1;}
              const skillsDir=path.join(pluginDir,"skills");
              if(!fs.existsSync(skillsDir)){console.error("skills missing: "+skillsDir);failed=1;}
              console.log("plugin "+p.name+" at "+p.source.path+": OK (v"+pj.version+")");
            }
            if(failed)process.exit(1);
          '
      - name: Validate marketplace.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.agents/plugins/marketplace.json','utf8'));console.log('marketplace.json OK');"
      - name: BUILD file present
        run: |
          set -e
          test -s "skills/collab/BUILD" || { echo "missing BUILD"; exit 1; }
          echo "BUILD=$(cat skills/collab/BUILD)"
      - name: Scripts import without crashing
        run: |
          set -e; shopt -s globstar nullglob; fail=0
          for f in skills/collab/scripts/*.mjs; do
            echo "import-loading $f"
            node --input-type=module -e "await import('./$f');" 2>&1 || fail=1
          done; exit $fail
      - name: Unit tests
        env:
          # Non-interactive git so any accidental network git call fails fast
          # instead of blocking on a credential prompt (no TTY in CI).
          GIT_TERMINAL_PROMPT: "0"
          GIT_SSH_COMMAND: "ssh -o BatchMode=yes -o ConnectTimeout=5"
          GIT_ASKPASS: "true"
        # --test-timeout names any single hanging test; `timeout` caps the whole
        # step so a hang surfaces as a fast, diagnosable failure (not a 6h stall).
        run: |
          set -o pipefail
          timeout 240 node --test --test-timeout=30000 tests/*.mjs 2>&1 | tee /tmp/suite.log
          # `node --test` exits 0 when tests are marked `todo`, so an exit-code check alone
          # lets a KNOWN, recorded defect pass the gate silently. A todo is an open defect,
          # not a pass: release stays blocked until the count is zero.
          todo=$(grep -oE 'todo [0-9]+' /tmp/suite.log | tail -1 | grep -oE '[0-9]+' || echo 0)
          if [ "${todo:-0}" -ne 0 ]; then
            echo "GATE FAIL: ${todo} todo test(s) — a recorded open defect is not a passing build."
            grep -nE '# TODO|todo' /tmp/suite.log | head -20
            exit 1
          fi
