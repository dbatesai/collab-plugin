name: Auto-tag
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag version
        run: |
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8')).version)")
          TAG="v${VERSION}"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git tag "$TAG" || echo "tag exists, skipping"
          git push origin "$TAG" || echo "tag already on remote"
